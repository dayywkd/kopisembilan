name: Supabase Daily Backup

on:
  schedule:
    - cron: '0 17 * * *' # Jam 00:00 WIB
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dump Database via Docker
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$PGPASSWORD" ]; then
            echo "Error: SUPABASE_DB_HOST atau SUPABASE_DB_PASSWORD belum diatur di GitHub Secrets!"
            exit 1
          fi
          mkdir -p backups
          # Menggunakan Docker agar pg_dump selalu versi yang tepat dan stabil
          # Menggunakan port 6543 karena ini adalah Transaction Pooler yang mendukung IPv4 (Gratis)
          docker run --rm \
            -e PGPASSWORD="$PGPASSWORD" \
            -v $(pwd)/backups:/backups \
            postgres:15 \
            pg_dump -h "$DB_HOST" -U postgres -d postgres -p 6543 --schema=public --no-owner --no-privileges -f /backups/backup_$(date +%Y-%m-%d).sql

      - name: Commit and Push Backup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Backup"
          git add backups/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-backup: $(date +%Y-%m-%d)"
          git push
